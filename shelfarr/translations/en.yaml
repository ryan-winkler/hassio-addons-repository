configuration:
  puid:
    name: PUID
    description: User ID for file ownership on writable mapped volumes.
  pgid:
    name: PGID
    description: Group ID for file ownership on writable mapped volumes.
  chown_on_start:
    name: Chown on start
    description: Whether to adjust ownership of storage/library paths at startup (auto/always/never). Set to "never" on read-only or permission-locked filesystems.
  audiobooks_path:
    name: Audiobooks path
    description: Folder Shelfarr places completed audiobooks into. Must be under /share or /media.
  ebooks_path:
    name: Ebooks path
    description: Folder Shelfarr places completed ebooks into. Must be under /share or /media.
  downloads_path:
    name: Downloads path
    description: Folder Shelfarr watches for completed downloads to post-process. Must be under /share or /media.
  rails_master_key:
    name: Rails master key
    description: Leave blank to auto-generate and persist a secret key in the add-on's own storage.
  rails_relative_url_root:
    name: Relative URL root
    description: Set only when reverse-proxying Shelfarr at a sub-path (e.g. "/shelfarr"), so generated links and assets resolve correctly. Leave blank for direct access or a dedicated subdomain (e.g. shelfarr.example.com).
  rails_max_threads:
    name: Max threads
    description: Puma thread count and the SQLite connection pool size (RAILS_MAX_THREADS). Leave blank for the safe default. If set, must be >= 5 — Solid Queue (running embedded in Puma) needs at least that many DB connections and will crash the app after a period of runtime if the pool is smaller.
  job_concurrency:
    name: Job concurrency
    description: Number of Solid Queue background worker processes (downloads, imports, scans).
  auth_disabled:
    name: Disable authentication
    description: Skip password login (username-only). Only enable on trusted networks.
  trust_nfs_uid_squash:
    name: Trust NFS UID squash
    description: Enable if audiobooks/ebooks/downloads paths are on an NFS mount that squashes UIDs, to avoid unnecessary ownership errors.
  allow_nonatomic_nfs_directory_publication:
    name: Allow non-atomic NFS directory publication
    description: Allows directory imports when NFS rejects atomic no-replace renames. Enable only for a single-writer NFS export.
  tz:
    name: Time zone
    description: IANA time zone used for displayed timestamps (e.g. America/New_York). Leave blank for the container default (UTC).
